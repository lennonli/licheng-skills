# 监控主体清单模板 —— 复制为 targets.yaml 后按实际主体填写（加公司只改本文件）
companies:
  - name: <公司全称>                     # 工商登记全称
    short: <证券简称或四字短名>           # 社媒检索主词
    neeq_code: "<挂牌代码>"              # 如适用; 无则留空
    credit_code: "<统一社会信用代码>"     # 主体核验后录入
    region: <省市>
    industry: <行业一句话>
    legal_rep: <法定代表人>              # 仅存本文件, 勿誊入外发文档
    bse_track: <当前北交所/IPO/港股阶段一句话>
    aliases: [<简称>, <习惯称谓>]        # 常见误命中同名企业也在此记录供降噪
    risk_extra: []

# 负面舆情关键词（社媒/新闻检索组合词）
negative_keywords: [诉讼, 仲裁, 处罚, 立案, 调查, 被执行, 失信, 冻结, 查封, 破产, 欠薪,
  拖欠, 裁员, 维权, 投诉, 曝光, 举报, 质量, 事故, 违约, 退货, 售后, 整改, 警示, 问询, 中止, 终止]

# 高危词（命中即红色分级）
red_keywords: [刑事, 被执行, 失信, 限高, 严重违法, 立案调查, 移送, 终止上市]
